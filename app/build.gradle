plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'tw.boox.ereading'
    compileSdk 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId 'tw.boox.ereading'
        minSdk 33
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // SHA-256 of the speech model archive, pinned by CI so a tampered download is refused.
        buildConfigField 'String', 'VOSK_SHA256', "\"${project.findProperty('voskSha') ?: ''}\""
        externalNativeBuild { cmake { targets "reader_mobi", "mobi" } }
    }
    // CI points SIGNING_KEYSTORE at the project key, so every build can update the previous
    // install. Local builds without it keep the default debug key.
    signingConfigs {
        debug {
            def keystore = System.getenv('SIGNING_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    // One APK per ABI: arm64-v8a for BOOX Go 7, x86_64 only for the CI emulator.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    packaging {
        resources {
            // Post-quantum algorithm tables pulled in with BouncyCastle by PDFBox. Opening an
            // encrypted PDF never uses them.
            excludes += ['org/bouncycastle/pqc/**']
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
