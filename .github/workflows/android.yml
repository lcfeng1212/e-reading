name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Prepare offline Chinese voice model
        run: |
          curl --fail --location --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o /tmp/boox-model.zip
          unzip -q /tmp/boox-model.zip -d /tmp/boox-voice
          mkdir -p app/src/main/assets
          mv /tmp/boox-voice/vosk-model-small-cn-0.22 app/src/main/assets/model-cn
          test -s app/src/main/assets/model-cn/am/final.mdl
      - name: Prepare Chinese conversion dictionaries
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/BYVoid/OpenCC/tar.gz/refs/tags/ver.1.1.9 -o /tmp/opencc.tar.gz
          mkdir -p /tmp/opencc app/src/main/assets/opencc
          tar -xzf /tmp/opencc.tar.gz -C /tmp/opencc --strip-components=1
          for name in STPhrases STCharacters TSPhrases TSCharacters TWVariants; do
            cp "/tmp/opencc/data/dictionary/$name.txt" app/src/main/assets/opencc/
          done
          cat /tmp/opencc/data/dictionary/TWPhrases*.txt > app/src/main/assets/opencc/TWPhrases.txt
          test -s app/src/main/assets/opencc/TWPhrases.txt
          cp /tmp/opencc/LICENSE app/src/main/assets/opencc/
      - name: Prepare unprotected MOBI parser
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/bfabiszewski/libmobi/tar.gz/refs/tags/v0.12 -o /tmp/libmobi.tar.gz
          mkdir -p vendor/libmobi app/src/main/assets/libmobi
          tar -xzf /tmp/libmobi.tar.gz -C vendor/libmobi --strip-components=1
          cp vendor/libmobi/COPYING* app/src/main/assets/libmobi/
          mkdir -p app/src/androidTest/assets
          cp vendor/libmobi/tests/samples/sample-unicode-{huffdic,uncompressed}.mobi app/src/androidTest/assets/
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BOOX-Go7-e-reading
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-boox-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the Android 13 reader
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest
