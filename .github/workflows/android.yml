name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Write is used only by the last step on main, to publish the APK and mirror the voice model.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Pin the voice model downloaded on first use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app downloads the model the first time voice is switched on. Fetch it here only to
          # pin its SHA-256, preferring this project's mirror so the checksum matches what users get.
          if gh release download voice-model-cn-0.22 -R "$GITHUB_REPOSITORY" -p vosk-model-small-cn-0.22.zip -O /tmp/voice-model.zip; then
            echo "Using the mirrored model"
          else
            curl --fail --location --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o /tmp/voice-model.zip
          fi
          unzip -l /tmp/voice-model.zip | grep -q 'vosk-model-small-cn-0.22/am/final.mdl'
          echo "ORG_GRADLE_PROJECT_voskSha=$(sha256sum /tmp/voice-model.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Use the project signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          # A fixed key lets each new APK install over the previous one, keeping the shelf.
          # Without the secret, each run signs with a new key and updates need a reinstall.
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Signing with the project key"
          else
            echo "::warning::DEBUG_KEYSTORE secret not set; this APK cannot update an earlier install"
          fi
      - name: Prepare Chinese conversion dictionaries
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/BYVoid/OpenCC/tar.gz/refs/tags/ver.1.1.9 -o /tmp/opencc.tar.gz
          mkdir -p /tmp/opencc app/src/main/assets/opencc
          tar -xzf /tmp/opencc.tar.gz -C /tmp/opencc --strip-components=1
          for name in STPhrases STCharacters TSPhrases TSCharacters TWVariants; do
            cp "/tmp/opencc/data/dictionary/$name.txt" app/src/main/assets/opencc/
          done
          cat /tmp/opencc/data/dictionary/TWPhrases*.txt > app/src/main/assets/opencc/TWPhrases.txt
          test -s app/src/main/assets/opencc/TWPhrases.txt
          cp /tmp/opencc/LICENSE app/src/main/assets/opencc/
      - name: Prepare unprotected MOBI parser
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/bfabiszewski/libmobi/tar.gz/refs/tags/v0.12 -o /tmp/libmobi.tar.gz
          mkdir -p vendor/libmobi app/src/main/assets/libmobi
          tar -xzf /tmp/libmobi.tar.gz -C vendor/libmobi --strip-components=1
          cp vendor/libmobi/COPYING* app/src/main/assets/libmobi/
          mkdir -p app/src/androidTest/assets
          cp vendor/libmobi/tests/samples/sample-unicode-{huffdic,uncompressed}.mobi app/src/androidTest/assets/
      - run: gradle :app:assembleDebug
      - name: Name the APK by version
        id: apk
        run: |
          version=$(jq -er '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          name="e-reading-v$version"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Report APK size by part
        run: |
          python3 - "${{ steps.apk.outputs.name }}.apk" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, os, sys, zipfile
          path = sys.argv[1]
          parts = collections.Counter()
          for item in zipfile.ZipFile(path).infolist():
              name = item.filename
              key = '/'.join(name.split('/')[:2]) if name.startswith(('lib/', 'assets/')) else name.split('/')[0]
              if key.startswith('classes') and key.endswith('.dex'): key = 'classes*.dex'
              parts[key] += item.compress_size
          print(f"### APK {os.path.getsize(path) / 1e6:.1f} MB\n\n| 大小 (MB) | 部分 |\n|---:|---|")
          for key, size in parts.most_common(15): print(f"| {size / 1e6:.2f} | `{key}` |")
          files = sorted(zipfile.ZipFile(path).infolist(), key=lambda i: -i.compress_size)[:12]
          print("\n| 大小 (MB) | 最大的檔案 |\n|---:|---|")
          for item in files: print(f"| {item.compress_size / 1e6:.2f} | `{item.filename}` |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}.apk
          if-no-files-found: error
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-boox-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the Android 13 reader
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest
      - name: Publish the installable APK and mirror the voice model
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          if ! gh release view voice-model-cn-0.22 -R "$repo" >/dev/null 2>&1; then
            gh release create voice-model-cn-0.22 /tmp/voice-model.zip -R "$repo" --latest=false \
              --title "離線中文語音模型 vosk-model-small-cn-0.22" \
              --notes "e-reading 第一次開啟語音翻頁時下載。來源：https://alphacephei.com/vosk/models（Apache 2.0）。"
          fi
          version=$(jq -er '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          tag="v$version"
          cp "${{ steps.apk.outputs.name }}.apk" e-reading.apk
          if ! gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            gh release create "$tag" -R "$repo" --latest --title "e-reading $tag" \
              --notes "在 BOOX Go 7 用瀏覽器開啟 https://github.com/$repo/releases/latest/download/e-reading.apk 即可下載安裝。"
          fi
          gh release upload "$tag" e-reading.apk "${{ steps.apk.outputs.name }}.apk" -R "$repo" --clobber
